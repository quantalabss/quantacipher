[package]
name = "quantacipher-core"
version = "2.1.0"
edition = "2021"
description = "Zero-trust post-quantum encryption core — ML-KEM-1024 (FIPS 203) + AES-256-GCM"
repository = "https://github.com/quantalabss/quantacipher"
license = "MIT"
readme = "README.md"
authors = ["QuantaLabs"]

[dependencies]
base64 = "0.21"
aes-gcm = "0.10"
ml-kem = "=0.2.3"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ml-dsa: RustCrypto pure-Rust FIPS 204 (ML-DSA) implementation.
# EXACT version pinned (=0.1.1) pending upstream independent audit; flagged for QuantaKrypto re-review.
ml-dsa = { version = "=0.1.1", features = ["getrandom", "rand_core"] }
# falcon-rs: pure-Rust FN-DSA (FIPS 206 draft, formerly Falcon) — WASM-compatible, no C FFI
# NOTE: pqcrypto-falcon was explicitly rejected; it requires C FFI and cannot compile to wasm32-unknown-unknown
# The crate name on crates.io is falcon-rs but the Rust module name is `falcon`
falcon-rs = { version = "0.2.5", features = ["std"] }
# Hybrid KEM dependencies (X-Wing / draft-connolly-cfrg-xwing-kem: X25519 + ML-KEM-768)
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
sha3 = "0.10"
# Classical ECC for Hybrid Signatures (TEC 910018:2025 Fig 3: ECDSA P-256 + FIPS 204 ML-DSA-65)
p256 = { version = "0.13", features = ["ecdsa"] }
# 3GPP 5G PQ-IES dependencies (TEC 910028:2025: AES-256-CTR, HMAC-SHA256)
aes = "0.8"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"
rsa = { version = "0.9", features = ["sha2"] }
signature = "2.2"


[[bench]]
name = "crypto_bench"
harness = false
