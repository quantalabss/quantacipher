[package]
name = "quantacipher-wasm"
version = "2.0.6"
edition = "2021"
description = "Zero-trust post-quantum encryption WASM bindings — ML-KEM-1024 (FIPS 203) + AES-256-GCM"
repository = "https://github.com/quantalabss/quantacipher"
license = "MIT"
readme = "README.md"
authors = ["QuantaLabs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
quantacipher-core = { path = "../quantacipher-core" }
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
serde_json = "1"
base64 = "0.21"
