name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish-npm:
    name: Publish npm packages (SDK & WASM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd quantacipher-wasm
          wasm-pack build --target web --out-dir pkg

      - name: Build SDK
        run: |
          cd quantacipher-sdk-js
          npm ci
          npm run build
      
      - name: Publish SDK with Provenance
        run: |
          cd quantacipher-sdk-js
          npm publish --provenance --access public

      - name: Publish WASM with Provenance
        run: |
          cd quantacipher-wasm/pkg
          npm publish --provenance --access public

  build-and-publish-pypi:
    name: Publish Python bindings to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheel
        run: |
          cd quantacipher-python
          pip install maturin
          maturin build --release
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: quantacipher-python/target/wheels/

  build-and-publish-crates:
    name: Publish quantacipher-core to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to crates.io
        run: |
          cd quantacipher-core
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
